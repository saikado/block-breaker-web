<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Block Breaker — WebGL描画テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#f0f4ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}#panel{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}#info{padding:10px 12px;background:#0a1324da;border:1px solid #52617b80;border-radius:12px;font-size:12px;line-height:1.7;backdrop-filter:blur(6px)}#info strong{font-size:14px}#controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:1px solid #7182a4;background:#172b4a;color:#f2f6ff;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600}button:active{background:#31547c}#error{position:fixed;left:12px;right:12px;top:48%;text-align:center;color:#ffd0d0;font-size:13px;white-space:pre-wrap}</style>
</head>
<body><div id="panel"><div id="info"><strong>BLOCK BREAKER / WEB TEST</strong><div id="stats">読み込み中...</div><div>1本指: 回転　2本指: ズーム</div></div></div><div id="error"></div><div id="controls"><button id="toggle">建物: 100棟</button><button id="lights">窓: 点灯</button><button id="reset">視点を戻す</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
try {
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c32);scene.fog=new THREE.FogExp2(0x101c32,.008);
 const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0x93bbff,0x151a2d,2));const sun=new THREE.DirectionalLight(0xe7dcbd,2.2);sun.position.set(25,50,15);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(320,320),new THREE.MeshStandardMaterial({color:0x25364c,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.07;scene.add(ground);
 const grid=new THREE.GridHelper(320,40,0x50627b,0x36465f);grid.position.y=-.05;scene.add(grid);
 const boxGeo=new THREE.BoxGeometry(1,1,1),windowGeo=new THREE.PlaneGeometry(1,1);
 const wallMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.78,metalness:.12});const litMat=new THREE.MeshBasicMaterial({color:0xffd381,side:THREE.DoubleSide});const darkMat=new THREE.MeshBasicMaterial({color:0x243853,side:THREE.DoubleSide});
 const max=400, building=new THREE.InstancedMesh(boxGeo,wallMat,max),windows=new THREE.InstancedMesh(windowGeo,litMat,max*30),darkWindows=new THREE.InstancedMesh(windowGeo,darkMat,max*30);scene.add(building,windows,darkWindows);
 const helper=new THREE.Object3D();const colors=[0x607eae,0x72919a,0xa67b84,0x7188a9,0x8b879e,0x8b9b7b];let count=100,lightOn=true,litCount=0,darkCount=0;
 function rebuild(){let n=0;litCount=0;darkCount=0;const side=Math.round(Math.sqrt(count));for(let i=0;i<count;i++){let row=Math.floor(i/side),col=i%side;let x=(col-(side-1)/2)*8,z=(row-(side-1)/2)*8;let floors=1+((i*17+Math.floor(i/5)*3)%7),h=floors*2.8;helper.position.set(x,h/2,z);helper.scale.set(5.8,h,5.8);helper.rotation.set(0,0,0);helper.updateMatrix();building.setMatrixAt(n,helper.matrix);building.setColorAt(n,new THREE.Color(colors[i%colors.length]));n++;
  for(let f=0;f<floors;f++)for(let w=0;w<3;w++){let lit=((i+f*3+w)%4)!==0;helper.position.set(x-1.75+w*1.75,1.15+f*2.8,z+2.92);helper.scale.set(1.05,1.3,1);helper.rotation.set(0,0,0);helper.updateMatrix();if(lit){windows.setMatrixAt(litCount++,helper.matrix)}else{darkWindows.setMatrixAt(darkCount++,helper.matrix)}}}
 building.count=n;windows.count=lightOn?litCount:0;darkWindows.count=darkCount+(lightOn?0:0);building.instanceMatrix.needsUpdate=true;building.instanceColor.needsUpdate=true;windows.instanceMatrix.needsUpdate=true;darkWindows.instanceMatrix.needsUpdate=true;
 document.getElementById('toggle').textContent='建物: '+count+'棟';document.getElementById('lights').textContent='窓: '+(lightOn?'点灯':'消灯');}
 let az=.65,polar=.95,radius=76;const target=new THREE.Vector3(0,6,0);function view(){let p=target;camera.position.set(p.x+radius*Math.sin(polar)*Math.sin(az),p.y+radius*Math.cos(polar),p.z+radius*Math.sin(polar)*Math.cos(az));camera.lookAt(target)}view();rebuild();
 const pointers=new Map();let prevDistance=0;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);prevDistance=0});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);if(pointers.size===1){az-=(e.clientX-prev[0])*.008;polar=Math.max(.2,Math.min(1.48,polar+(e.clientY-prev[1])*.008));view()}pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let a=[...pointers.values()];let dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(prevDistance)radius=Math.max(18,Math.min(180,radius*prevDistance/dist));prevDistance=dist;view()}});function pointerEnd(e){pointers.delete(e.pointerId);prevDistance=0}renderer.domElement.addEventListener('pointerup',pointerEnd);renderer.domElement.addEventListener('pointercancel',pointerEnd);
 document.getElementById('toggle').onclick=()=>{count=count===100?400:100;rebuild();radius=count===400?125:76;view()};document.getElementById('lights').onclick=()=>{lightOn=!lightOn;windows.material.color.setHex(lightOn?0xffd381:0x34465b);rebuild()};document.getElementById('reset').onclick=()=>{az=.65;polar=.95;radius=count===400?125:76;view()};
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 let last=performance.now(),frames=0,fps=0;const stats=document.getElementById('stats');function loop(now){requestAnimationFrame(loop);renderer.render(scene,camera);frames++;if(now-last>650){fps=Math.round(frames*1000/(now-last));frames=0;last=now;stats.textContent=`${fps} FPS / ${count} buildings / ${litCount+darkCount} windows / ${renderer.info.render.calls} draw calls`}}requestAnimationFrame(loop);
}catch(err){document.getElementById('error').textContent='実行エラー: '+err.message;console.error(err)}
</script></body></html>
